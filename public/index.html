<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Relativity Gravity</title>

<style>
body { margin:0; overflow:hidden; background:white; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls.js":
      "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/controls/OrbitControls.js"
  }
}
</script>

<script>
var Module = {
  locateFile: (p)=> p.endsWith(".wasm") ? "sim.wasm" : p,
  onRuntimeInitialized: function () {
    const wait = setInterval(() => {
      if (window.startApp) {
        clearInterval(wait);
        window.startApp();
      }
    }, 10);
  }
};
</script>

<script src="sim.js"></script>
</head>

<body>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

const G = 6.67430e-11;
const c = 299792458;
const SPACE_SCALE = 1e-9;

// =========================
// Three.js
// =========================
const meshes = [];
const trails = []; // ←追加

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100000);
camera.position.set(0, 500, 2000);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(200,300,200);
scene.add(light);

// =========================
// グリッド
// =========================
const geometry = new THREE.PlaneGeometry(2000,2000,150,150);
geometry.rotateX(-Math.PI/2);

const plane = new THREE.Mesh(
  geometry,
  new THREE.MeshBasicMaterial({ color:0x000000, wireframe:true })
);
scene.add(plane);

// =========================
// WASM
// =========================
let simStep, getCount, getPositions, getMasses;

window.startApp = function () {

  Module.ccall("init_simulation");

  simStep      = Module.cwrap("step");
  getCount     = Module.cwrap("get_count", "number", []);
  getPositions = Module.cwrap("get_positions", "number", []);
  getMasses    = Module.cwrap("get_masses", "number", []);

  const count = getCount();

  for (let i = 0; i < count; i++) {

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(i===0?80:20,32,32),
      new THREE.MeshStandardMaterial({
        color: i===0?0xffcc00:0x3399ff,
        emissive: i===0?0xffaa00:0x000000,
        emissiveIntensity: i===0?5:0
      })
    );

    scene.add(mesh);
    meshes.push(mesh);

    // 軌道
    const trail = new THREE.Line(
      new THREE.BufferGeometry(),
      new THREE.LineBasicMaterial({ color:0x000000 })
    );

    scene.add(trail);
    trails.push({ line: trail, points: [] });
  }

  animate();
};

// =========================
// アニメーション
// =========================
function animate(){

  requestAnimationFrame(animate);

  simStep();

  const count = getCount();

  const posPtr = getPositions();
  const arr = new Float64Array(Module.HEAPF64.buffer, posPtr, count*3);

  const massPtr = getMasses();
  const masses = new Float64Array(Module.HEAPF64.buffer, massPtr, count);

  // =========================
  // 🌍 惑星位置更新 + 軌道
  // =========================
  for (let i = 0; i < count; i++) {

    const posVec = new THREE.Vector3(
      arr[i*3] * SPACE_SCALE,
      arr[i*3+1] * SPACE_SCALE,
      arr[i*3+2] * SPACE_SCALE
    );

    meshes[i].position.copy(posVec);

    const trail = trails[i];
    trail.points.push(posVec.clone());

    if (trail.points.length > 200) {
      trail.points.shift();
    }

    trail.line.geometry.setFromPoints(trail.points);
  }

  // =========================
  // 🌌 空間の歪み
  // =========================
const pos = plane.geometry.attributes.position;

for (let i = 0; i < pos.count; i++) {

  let worldX = pos.getX(i) / SPACE_SCALE;
  let worldZ = pos.getZ(i) / SPACE_SCALE;

  let y = 0;

  for (let j = 0; j < count; j++) {

    const bx = arr[j * 3];
    const bz = arr[j * 3 + 2];
    const m  = masses[j];

    const dx = worldX - bx;
    const dz = worldZ - bz;

    const dist = Math.sqrt(dx * dx + dz * dz) + 1e9;

    // 🔥 Newton型ポテンシャル（安定版）
    y += - (G * m) / dist;
  }

  // 🔥 見やすいようにスケーリング
  pos.setY(i, y * 1e-7);
}


  pos.needsUpdate = true;
  plane.geometry.computeVertexNormals();

  controls.update();
  renderer.render(scene,camera);
}

</script>
</body>
</html>
